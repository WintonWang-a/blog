<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Winton Blog 后台管理页。">
  <title>后台 | Winton Blog</title>
  <link rel="stylesheet" href="./assets/style.css">
  <script defer src="./assets/site-config.js"></script>
  <script defer src="./assets/blog-api.js"></script>
  <script defer src="./assets/admin.js"></script>
</head>
<body class="admin-page">
  <div class="bg-orb bg-orb-a"></div>
  <div class="bg-orb bg-orb-b"></div>
  <div class="bg-grid"></div>

  <header class="site-header shell">
    <a class="brand" href="./index.html">
      <span class="brand-mark">✦</span>
      <span>Winton Blog</span>
    </a>
    <nav class="nav">
      <a href="./index.html">首页</a>
      <a href="./about.html">简历</a>
      <a href="./posts/hello-world.html">文章</a>
      <a href="./dynamic.html">动态</a>
      <a href="./admin.html">后台</a>
    </nav>
    <span class="status-pill">Admin</span>
  </header>

  <main class="shell admin-shell stack">
    <section class="auth-card glass" data-login-panel>
      <div class="section-head">
        <div>
          <p class="eyebrow">后台登录</p>
          <h2>输入密码进入管理端</h2>
        </div>
      </div>
      <form class="admin-login" data-login-form>
        <input class="field-input" type="password" name="password" placeholder="后台密码" required>
        <button class="btn primary" type="submit">登录</button>
      </form>
      <p class="comment-tip">默认密码来自后端环境变量 `BLOG_ADMIN_PASSWORD`。</p>
    </section>

    <section class="dashboard" data-dashboard hidden>
      <div class="summary-grid" data-summary></div>

      <div class="dashboard-grid">
        <section class="admin-card glass">
          <div class="section-head">
            <div>
              <p class="eyebrow">动态管理</p>
              <h2>发布 / 编辑</h2>
            </div>
            <button class="link-button" type="button" data-logout>退出登录</button>
          </div>
          <form class="post-form" data-post-form>
            <div class="form-grid">
              <label>
                <span>标题</span>
                <input class="field-input" name="title" required>
              </label>
              <label>
                <span>Slug</span>
                <input class="field-input" name="slug" required>
              </label>
              <label>
                <span>分类</span>
                <input class="field-input" name="category" value="动态">
              </label>
              <label>
                <span>发布日期</span>
                <input class="field-input" type="date" name="publishedAt">
              </label>
            </div>
            <label>
              <span>摘要</span>
              <textarea class="field-textarea" name="summary" rows="3"></textarea>
            </label>
            <label>
              <span>正文</span>
              <textarea class="field-textarea" name="content" rows="10" required></textarea>
            </label>
            <button class="btn primary" type="submit">发布动态</button>
          </form>
        </section>

        <section class="admin-card glass">
          <div class="section-head">
            <div>
              <p class="eyebrow">动态列表</p>
              <h2>已发布内容</h2>
            </div>
          </div>
          <div class="table-wrap">
            <table class="table">
              <thead>
                <tr>
                  <th>标题</th>
                  <th>分类</th>
                  <th>日期</th>
                  <th>评论</th>
                  <th>操作</th>
                </tr>
              </thead>
              <tbody data-post-list></tbody>
            </table>
          </div>
        </section>

        <section class="admin-card glass full-width">
          <div class="section-head">
            <div>
              <p class="eyebrow">评论管理</p>
              <h2>游客留言</h2>
            </div>
          </div>
          <div class="table-wrap">
            <table class="table">
              <thead>
                <tr>
                  <th>文章</th>
                  <th>昵称</th>
                  <th>内容</th>
                  <th>时间</th>
                  <th>操作</th>
                </tr>
              </thead>
              <tbody data-admin-comment-list></tbody>
            </table>
          </div>
        </section>
      </div>
    </section>
  </main>
</body>
</html>
