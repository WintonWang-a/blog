      <h1>博客性能优化清单</h1>
      <p class="meta">2026-08-28</p>
      <p>只保留必要样式和少量脚本，页面会更快，部署也更稳。</p>
      <p>这次首页虽然加入了更完整的 Banner、材质层和双栏布局，但依然尽量把资源控制在简单范围内，没有额外引入大型前端框架。</p>
      <p>图片尽量压缩，脚本按页加载，结构清楚，通常就是最有效也最稳妥的优化。</p>
